# Dev-окружение Selen. Запуск: make up (см. Makefile и docs/runbook.md).
# Все переменные берутся из корневого .env (шаблон — .env.example).
name: selen

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: selen-php:dev
  env_file: .env
  volumes:
    - ./backend:/var/www/backend
    # Тот же корневой .env, что и в env_file, — по стандартному для Laravel пути
    - ./.env:/var/www/backend/.env:ro
    # Только чтение: тесты backend сверяют каталог событий с frontend (EventTypeCatalogTest)
    - ./frontend:/var/www/frontend:ro
    # Только чтение: тест backend импортирует отложенные задачи PM (PmStandCommandsTest)
    - ./docs/pm:/var/www/docs/pm:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      # Только с этой машины (как у стенда): иначе dev открыт в офисную сеть и tailnet (ADR-0018)
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Вложения карточек: nginx отдаёт их по X-Accel-Redirect после проверки доступа в Laravel
      - ./backend/storage/app/private/attachments:/var/www/attachments:ro
    depends_on:
      - php
      - node
    restart: unless-stopped

  php:
    <<: *php

  # Обработчик очереди (письма и прочие фоновые задачи).
  # queue:listen перечитывает код на каждой задаче — удобно в dev.
  queue:
    <<: *php
    command: php artisan queue:listen redis --tries=3 --backoff=10 --timeout=60

  # Планировщик Laravel (routes/console.php).
  scheduler:
    <<: *php
    command: php artisan schedule:work

  # Vite dev server с hot reload. Зависимости ставит `make up`.
  node:
    image: node:24-alpine
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      APP_PORT: ${APP_PORT:-8080}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}
      npm_config_cache: /tmp/.npm
    volumes:
      - ./frontend:/app
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-selen}
      # Суперпользователь образа — только для обслуживания (make db-roles); приложение и миграции работают
      # под своими ролями (docs/adr/0016-db-roles.md), их создаёт docker/postgres/init/02-roles.sh
      POSTGRES_USER: ${DB_SUPERUSER:-selen}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-secret}
      SELEN_DB_OWNER: ${DB_OWNER_USERNAME:-selen_owner}
      SELEN_DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-secret}
      SELEN_DB_APP: ${DB_USERNAME:-selen_app}
      SELEN_DB_APP_PASSWORD: ${DB_PASSWORD:-secret}
      TZ: UTC
      PGTZ: UTC
    ports:
      # Только с этой машины: у dev-базы пароли по умолчанию из .env.example
      - "127.0.0.1:${FORWARD_DB_PORT:-54320}:5432"
    volumes:
      # В образе postgres 18+ данные лежат в /var/lib/postgresql/<версия>/docker
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/sql:/selen-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Перехватчик почты: веб-интерфейс http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
