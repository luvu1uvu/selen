# Отложенные задачи PM. make pm-backlog OWNER=<email PM> заводит их карточками на доске «Бэклог»
# пространства LATER стенда PM (docs/runbook.md, «Стенд PM»).
#
# Повторный запуск ничего не дублирует: карточка с тем же названием (в том числе архивная) пропускается,
# уже заведённые карточки не меняются — дальше их ведёт PM на стенде. Новая задача — новый пункт в конце.
#
#   title        — название карточки (уникальное)
#   column       — «Идеи / без решения» или «Отложено до этапа» (бывают ещё «Взято в работу», «Сделано»)
#   labels       — метки: этап 7, этап 8, этап 11, инфраструктура, безопасность, UX (можно не указывать);
#                  номера этапов — по docs/roadmap.md
#   description  — 1–3 предложения: зачем это нужно
#
# Убраны — решение PM 2026-10-20: не делаем (на стенде карточка в архиве): «ИИ-помощник в карточке («Спросить ИИ»)»
# (LATER-15). Таймер ▶ (LATER-1) — больше не здесь: решение PM 2026-10-22 — делаем, этап 6, вместе с ручным учётом
# времени; на стенде карточка возвращена из архива, в списке — под новым названием (в конце файла).
#
# Убраны — решение PM 2026-10-21, актуализация бэклога (на стенде карточки в архиве, причина — комментарием в каждой):
#   - «Донастройка прав Владельца» (LATER-11) — решается в плане «Права 2.0», пункт добавлен в LATER-47;
#   - «Тесты backend в несколько потоков (pest --parallel)» (LATER-34) — ограничение уже в CLAUDE.md, «Ловушки»;
#     проверка при обновлениях — в LATER-36 «Обновления молодых мажорных версий»;
#   - «Быстрый старт перетаскивания на больших досках» (LATER-37) — объединена с LATER-83 «Быстрое открытие
#     пространства»: тот же способ и тот же момент, когда брать;
#   - «Обход ошибки npx shadcn add (посторонний пакет cn)» (LATER-38) — обход уже в CLAUDE.md, «Ловушки»; проверка
#     при обновлении CLI — в LATER-36.
#
# Импорт из Kaiten отменён — решение PM 2026-10-21: перенос из Kaiten вручную, начиная с приглашения сотрудников,
# чтобы сразу проверить весь функционал (docs/roadmap.md, строка «Пилот»). История из Kaiten (переходы, комментарии,
# метрики) в Selen не переезжает, поэтому Kaiten на время пилота остаётся доступным для чтения.

- title: "Избранное: раздел в полосе слева и «Добавить в избранное»"
  column: Отложено до этапа
  labels: [этап 7]
  description: >-
    Быстрый доступ к своим пространствам и доскам без поиска по дереву: раздел «Избранное» в полосе разделов
    и пункт «Добавить в избранное» в меню «⋯» строки дерева, как в Kaiten.

- title: Создать копию пространства или папки
  column: Отложено до этапа
  labels: [этап 7]
  description: >-
    Новая команда или проект заводятся по образцу существующих. Диалог спрашивает, что копировать:
    доски, колонки, участников, карточки.

- title: "Доска на весь экран: полоса горизонтальной прокрутки внизу окна"
  column: Отложено до этапа
  labels: [этап 7]
  description: >-
    Сейчас страница доски прокручивается вниз целиком, и полоса прокрутки вбок оказывается под самой длинной
    колонкой. Как в Kaiten, доска должна занимать экран до низа, а обе прокрутки — быть внутри неё.

- title: Перетаскивание (DnD) в «Структуре»
  column: Идеи / без решения
  labels: [UX]
  description: >-
    Переставлять папки и пространства мышью, а не через меню «Переместить в…» и «Выше/Ниже».
    Меню остаётся — оно доступно с клавиатуры.

- title: Восстановление архивных колонок и дорожек
  column: Идеи / без решения
  description: >-
    Сейчас архивная колонка или дорожка не возвращается на доску из интерфейса, хотя данные сохраняются.
    Kaiten это умеет — ошибочную архивацию можно отменить.

- title: Миниатюры картинок для превью вложений
  column: Идеи / без решения
  description: >-
    Превью сейчас — тот же файл, уменьшенный в браузере: большие скриншоты грузятся долго.
    Миниатюры, сгенерированные в фоне, ускорят карточки с картинками.

- title: Анонимизация данных уволенных сотрудников
  column: Идеи / без решения
  labels: [безопасность]
  description: >-
    По запросу или по сроку заменять имя и email уволенного сотрудника и чистить журнал входов.
    Журнал событий хранит только id, поэтому история не пострадает; нужна процедура с записью в журнал.

- title: Смена email пользователя администратором
  column: Идеи / без решения
  description: >-
    Сотрудник сменил почту — администратор меняет email без нового приглашения, с подтверждением нового адреса
    и событием в журнале.

- title: Руководители групп (сами меняют состав группы)
  column: Идеи / без решения
  description: >-
    Руководитель отдела сам добавляет и убирает людей в своей группе, не дожидаясь системного администратора.

- title: Тихие часы уведомлений
  column: Идеи / без решения
  description: >-
    Не присылать уведомления ночью и в выходные (или копить их до утра), чтобы Selen не будил людей.

- title: Telegram как канал уведомлений
  column: Идеи / без решения
  description: >-
    Уведомления о назначениях, упоминаниях и сроках — в Telegram, где сотрудники и так переписываются.

- title: «Кто сейчас смотрит / редактирует» (присутствие)
  column: Отложено до этапа
  labels: [этап 8]
  description: >-
    Видеть, кто ещё открыл карточку или документ, чтобы не перезаписывать правки друг друга.

- title: "Чат: свой (этап 13) или self-hosted (Mattermost / Rocket.Chat) с интеграцией"
  column: Идеи / без решения
  description: >-
    Решить, писать ли свой чат или поставить готовый self-hosted и связать его с карточками и уведомлениями.
    Готовый — быстрее, свой — без ещё одной системы.

- title: Одна доска в нескольких пространствах
  column: Идеи / без решения
  description: >-
    Общая доска для двух команд без копирования карточек. Затрагивает права: карточка видна по правам
    какого пространства.

- title: Перенос карточек между пространствами
  column: Идеи / без решения
  description: >-
    Карточку завели не там — перенести в другое пространство с историей, а не создавать заново.
    Номер карточки при этом меняется.

- title: Ограничение типов карточек по доскам
  column: Идеи / без решения
  description: >-
    На доске багов — только «Баг», на продуктовой — «История» и «Эпик»: меньше ошибок при создании карточек.

- title: Внешняя копия бэкапов (не на том же диске)
  column: Отложено до этапа
  labels: [инфраструктура]
  description: >-
    Бэкапы на том же сервере не спасут при потере диска или сервера. Нужна копия на другом сервере или носителе.

- title: Боевой SMTP и проверка писем
  column: Отложено до этапа
  labels: [инфраструктура]
  description: >-
    Подключить почтовый сервер компании и проверить, что приглашения и сброс пароля доходят и не попадают
    в спам.

- title: Деплой на VPS в РФ
  column: Отложено до этапа
  labels: [инфраструктура]
  description: >-
    Рабочий сервер Selen: HTTPS, бэкапы по расписанию, обновления без потери данных (стенд PM — репетиция).

- title: Зеркало репозитория на своём сервере (Gitea)
  column: Идеи / без решения
  labels: [инфраструктура]
  description: >-
    Код не должен зависеть только от GitHub: зеркало на своём сервере позволит продолжать работу
    при блокировке или недоступности.

