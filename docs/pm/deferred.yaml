# --- Решения PM 22.10: таймер возвращён (LATER-1); карточки стенда LATER-89, 91, 92, 97, 98 ------------------------

- title: Таймер учёта времени ▶ в карточке (этап 6, вместе с ручным учётом)
  column: Отложено до этапа
  description: >-
    Решение PM 22.10: делаем (отменено решение 20.10 «не делаем»). Этап 6 — вместе с ручным учётом времени: одна
    модель данных (записи времени), таймер — второй способ создать запись. Детали — в плане этапа 6.

    - Кнопка ▶ / ■ в ряду действий окна карточки (справа, как в Kaiten); у карточки — сколько времени потрачено
    всего и мной.

    - Один запущенный таймер на человека: запуск на другой карточке останавливает предыдущий (решение PM 22.10).

    - Идущий таймер с кнопкой «Стоп» виден откуда угодно (решение PM 22.10); где именно — варианты в плане этапа 6.

    - Защита от забытого таймера (решение PM 22.10): предел длительности или вопрос при следующем входе (например,
    после 8–10 ч или на следующий день) — запись не должна молча набегать сутками.

    - Остановка создаёт запись времени; она правится и удаляется, как ручная (свою; чужие — по правам).

    - Чужое время видят сам исполнитель и вышестоящие (роли с большими правами): право «видеть время других
    участников» — в каталоге «Прав 2.0» (LATER-47). Аналитика трудозатрат — этап 9, по праву, выданному лично или
    через группу (решение PM 22.10, ADR-0017, «Изменения»).

    - Время в БД — UTC; журнал событий — запуск, остановка, правка записи (без текстов).

- title: Тёмная тема и новая палитра по референсу PM (белая тема остаётся) — этап «Редизайн»
  column: Идеи / без решения
  labels: [UX]
  description: >-
    Идея PM 21.10. Этап — «Редизайн» (LATER-72): цвета и тёмная тема — ядро редизайна; сделанные раньше, они
    перекрашивались бы повторно. Если PM поставит «Редизайн» до пилота — тёмная тема придёт к пилоту. Раскладка
    и поведение остаются как в Kaiten (CLAUDE.md, Frontend 7) — меняется только облик.

    Референс — скриншот чужого концепта канбан-доски (во вложении карточки на стенде). В репозиторий его не кладём —
    только описание словами, как с референсами Kaiten. Что взять:

    - Тёмная тема: фон окна — почти чёрный графит; колонки — графитовые блоки чуть светлее, с крупным скруглением;
    карточки — ещё на тон светлее. Границы почти не используются — уровни различаются тоном.

    - Один акцентный цвет — сине-фиолетовый (кнопка «+», главная кнопка, выделение).

    - Категория или метка — короткая цветная полоска вверху карточки (зелёная, красная, жёлтая, синяя), а не бейдж.

    - Текст светлый, второстепенный — серый; мягкий контраст, много воздуха, крупный заголовок пространства.

    - Полоса разделов слева — значки с подписями, активный пункт — на подложке.

    Светлая тема остаётся. Переключатель: «Светлая / Тёмная / Как в системе» — в меню пользователя, выбор
    запоминается.

    Техника (сейчас — docs/ui-guidelines.md: тема только светлая, токены только в :root, классы dark: — задел):

    - Второй набор токенов .dark в index.css — стандартный путь shadcn/ui и Tailwind 4; компоненты не меняются, если
    берут цвета из токенов.

    - Около 35 мест с цветом палитры прямо в компоненте (CardTile, DueBadge, CardBlocksSection, alert, badge и др.) —
    перевести на токены. До редизайна: новые компоненты — только на токенах (правило уже есть в ui-guidelines).

    - Контраст WCAG AA в обеих темах; агент ux-reviewer проверяет обе темы; правила вида — для двух тем.

    Резюме ux-reviewer и решения PM 21.10 по нему (11 ответов) — в комментариях карточки на стенде; подготовка
    (ответ 11) — LATER-91.

- title: "Подготовка к тёмной теме: токены вместо цветов палитры, проверка в lint, контраст (после UI-1a)"
  column: Отложено до этапа
  labels: [UX]
  description: >-
    Решение PM 21.10 по резюме ux-reviewer в LATER-89 (пункт 11): подготовку к тёмной теме делаем до «Редизайна»,
    отдельной задачей и после мёржа UI-1a — UI-1a меняет те же файлы карточки. Вид интерфейса почти не меняется.
    Объём — S.

    Источник: LATER-89 — резюме ux-reviewer (две части, раздел 2 «Палитра» и раздел 6 «Объём и риски») и комментарий
    «Решения PM 21.10 по резюме ux-reviewer».

    Что сделать:

    - Смысловые токены в :root (index.css) со значениями «как сейчас»: danger, success, warning, категории колонок,
    board, lane, overlay, edge-shade, destructive-foreground и др. (список — в резюме, раздел 2). Набор .dark —
    не сейчас, это «Редизайн».

    - Перевести на токены около 47 цветов палитры Tailwind и hex в 15 файлах компонентов (CardTile, DueBadge,
    CardBlocksSection, alert, badge, button и др.).

    - Проверка в make lint (и CI): падает на цветах палитры Tailwind и hex в className компонентов, кроме оговорённых
    исключений.

    - Исправить известные провалы контраста светлой темы (резюме, раздел 6): muted-foreground, рамка фокуса без
    прозрачности, автоматический цвет текста меток (решение PM: свободный выбор цвета, текст — автоматически), три
    цвета аватаров, граница блокировки.

    Не входит (это «Редизайн», LATER-72 / LATER-89): набор .dark, переключатель тем, сине-фиолетовый акцент, выбранная
    строка дерева.

    В том же PR: решения PM по LATER-89 (10 ответов) перенести в репозиторий — журнал подэтапа и docs/ui-guidelines.md
    (CLAUDE.md, «Указания PM — только в репозитории»). LATER-89 и эта карточка в docs/pm/deferred.yaml уже есть
    (22.10).

    Приёмка: ревьюер кода, ux-reviewer (контраст до и после), визуальных изменений — минимум; тест-кейсы на то, что
    lint ловит цвет палитры.

- title: "Параллельные сессии: замок на dev, свой E2E-стек у каждой рабочей копии, правила в CLAUDE.md (после UI-1a)"
  column: Взято в работу
  labels: [инфраструктура]
  description: >-
    Решение PM 21.10. Когда: сразу после мёржа UI-1a, первой в очереди — до LATER-91 и UI-1b, чтобы их можно было
    вести параллельно.

    Проблема. Сессии Remote Control работают в своих рабочих копиях (.claude/worktrees/…), но стеки Docker общие:
    у dev фиксированное имя selen, у E2E — selen-e2e.

    - make up / restart из своей копии пересобирает dev (localhost:8080) из своего кода — соседняя сессия посреди
    работы видит чужую ветку; make fresh стирает её данные.

    - Тихая опасность: команды backend идут через docker compose exec php — в контейнер той копии, которая подняла
    dev: сессия из другой копии гоняет тесты и Larastan по чужому коду и видит «зелёное». Тестовая база selen_testing
    тоже одна на всех.

    - Два одновременных make e2e валят друг друга: стек один, в конце его сносят.

    Что сделать (вариант А + Б + В, согласован с PM):

    - Б. Замок на dev: перед make up, restart и всеми командами через exec php — проверка, из какой копии смонтирован
    работающий dev. Чужая копия — остановиться с понятным сообщением: из какой папки и ветки поднят dev и как его
    забрать. Забрать dev — отдельная явная команда, только с разрешения PM. Dev не запущен — работаем как обычно.
    make host-status показывает, из какой копии поднят dev.

    - В. Свой E2E-стек у каждой копии: имя проекта от рабочей копии; два прогона не конфликтуют по портам; make
    e2e-down убирает только свой стек.

    - А. Раздел «Параллельные сессии» в CLAUDE.md и runbook: своя рабочая копия у каждой сессии; dev — у одной сессии
    за раз, забирать только с разрешения PM; стенд — только make pm-*, одна сессия за раз; документы бэклога
    и дорожной карты — правит одна сессия, остальные просят PM.

    Не делаем: свой dev у каждой копии (вариант Г) — тяжело для Mac mini.

    Приёмка: ревьюер кода; тест-кейсы на две рабочие копии (замок срабатывает, сообщение понятное, забрать dev можно
    только явно; два make e2e параллельно не мешают друг другу); точечный аудит безопасности.

- title: "Наполнение окна карточки зависит от типа: набор полей по типу + любое поле через «+» (меню «+» как в Kaiten — в UI-1a, поля — этап 5)"
  column: Отложено до этапа
  labels: [UX]
  description: >-
    Задание PM 22.10. Наполнение окна карточки зависит от её типа: у каждого типа свой набор пользовательских полей,
    которые показываются в карточке сразу. Скриншоты меню «+» Kaiten — во вложениях карточки на стенде (в репозиторий
    не кладём, только описание словами).

    Как в Kaiten — меню «+» в окне карточки, две колонки:

    - Слева — системные параметры, доступны всем и всегда: «Основное» (срок, метки, чек-лист, ссылка, загрузить
    файл), «Связи» (родительская, дочерняя карточка), «Остальное» (в Kaiten — критерии приёмки, Google Drive,
    Dropbox).

    - Справа — «Поля»: поиск, «Создать новое поле» (только у кого есть право) и список пользовательских полей
    со значком типа поля (флажок, число, сотрудник, выбор из списка, ссылка, текст…).

    Правила:

    - Всегда видны, независимо от типа: расположение, тип, ответственный, участники (и остальное, что PM отнесёт
    к обязательным).

    - Тип карточки задаёт набор пользовательских полей по умолчанию — они в карточке сразу, в «Основных параметрах».

    - В любую карточку можно добавить через «+» любое поле, даже не предназначенное для её типа; добавленное поле
    остаётся в этой карточке.

    - Смена типа карточки: что с уже заполненными полями — уточнить у PM при старте этапа (предложение: значения
    не теряются, поле остаётся в карточке).

    - Создавать поля и настраивать наборы для типов — по правам («Права 2.0»; справочники компании — LATER-47).

    Сделано в UI-1a (PR #19): меню «+» в раскладке Kaiten, колонка «Поля» — заглушка с готовым местом под поля.

    Этап 5 «Пользовательские поля»: сами поля всех типов, наборы полей по типу карточки, добавление любого поля
    в карточку, «Создать новое поле» из «+». Модель данных — с учётом «Компаний» (LATER-47): поля и наборы —
    справочники компании.

    Не делаем в Selen: Google Drive, Dropbox. «Критерии приёмки» — уточнить у PM, нужны ли (можно как чек-лист или
    поле).

- title: Пачка UX-2 — мелочи UX окна карточки (после UI-1b, вместе с LATER-85)
  column: Отложено до этапа
  labels: [UX]
  description: >-
    Мелочи UX/UI-ревью окна карточки (UI-1a). Решение PM 22.10: одной пачкой после UI-1b, вместе с LATER-85.
    Подробности и замеры — docs/stages/ui-1.md, таблица UX/UI-ревью (U-…, V-…).

    Мелочи:

    - U-8: кнопки добавления внизу секций — отступ значка, текст с глаголом («Добавить чек-лист / ссылку /
    родительскую / дочернюю»), «Приложить файл» — внизу секции, как остальные; «Изменить» / «Удалить» у комментария —
    вровень с текстом.

    - U-9: после «Отмена» во встроенной форме (описание, блокировка) и щелчка по пустому месту окна фокус — на кнопке,
    которая открыла форму, а не на окне (иначе Tab уводит в самый верх).

    - U-10: окно, открытое по прямой ссылке, после закрытия — фокус на плитку этой карточки, если она на доске
    (сейчас — body).

    - U-12: ✕ окна — вровень со строкой названия (центр на 8 px выше).

    - U-13: «Снять ответственного» — над списком людей или ✕ у чипа ответственного (сейчас — в конце длинного списка).

    - U-17: тексты — «Ctrl+Enter — отправить» под «Отправить»; в ленте «Истории» — «План, ч» вместо «Оценка», регистр
    названий полей.

    - U-4 (по желанию): панель форматирования редактора — один Tab-стоп, стрелки внутри (WAI-ARIA toolbar).

    Вкус: V-1 — у формы новой блокировки рамка и заголовок «Новая блокировка»; V-2 — на плашке «Заблокирована
    карточкой DEV-…» вместо «Блокирует: DEV-…»; V-3 — значки lucide size-3 перед «Создана» и «Перемещена»; V-4 —
    подсказка «Создана» — «… · создал(а) ФИО»; V-5 — «Срочно» при просмотре текстом «Да» / «Нет» вместо полупрозрачного
    флажка; V-6 — у ссылки домен серым рядом с названием; V-7 — что название правится, заметнее при наведении.

    Решение PM 22.10 (приёмка PR #19), в пачку: «Срочно» в окне карточки видно всегда; «План, ч», пока не задан,
    скрыт и добавляется через «+» → «Основное», как срок (тест-кейс и автотест).
