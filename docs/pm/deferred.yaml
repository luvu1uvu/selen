  description: >-
    Хвост LATER-57, запись в docs/backlog.md («Функциональность»); перенесено на стенд при актуализации бэклога 21.10.

    Сейчас: значок «доступно всем сотрудникам» у пространства и папки и подсказка у пустой папки (видна Владельцу)
