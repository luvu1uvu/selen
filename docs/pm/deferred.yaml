- title: "К пилоту: закрыть мелочи аудита безопасности 2026-10 (S-3…S-9)"
  column: Отложено до этапа
  labels: [инфраструктура, безопасность]
  description: >-
    Решение PM 21.10 (актуализация бэклога). Источник — docs/security/audit-2026-10.md (подробно по каждому пункту:
    где, как воспроизвести, предложение) и docs/backlog.md, «Эксплуатация». Когда: до пилота и до полного аудита
    перед пилотом; небольшими отдельными PR, не в PR аудита.

    - S-3 — по времени ответа входа можно узнать, есть ли такой email (LoginAction: фиктивная проверка пароля
    для несуществующего).

    - S-4 — заголовки безопасности и server_tokens off в nginx стенда и будущего сервера (вместе с LATER-31).

    - S-5 — срок хранения логов nginx и php-fpm (IP, токены и email из ссылки сброса).

    - S-6 — лимит частоты и квота загрузки вложений.

    - S-7 — permissions у ci.yml, actions и образ gitleaks по SHA/digest (часть уже сделана — сверить с аудитом).

    - S-8 — права 700 у daily/, weekly/ и снапшотов *.files бэкапов.

    - S-9 — диск local с serve: true охватывает каталог вложений.

    Готово, когда: по каждому пункту — исправление или решение PM «не делаем» с причиной; статус отмечен
    в audit-2026-10.md.

