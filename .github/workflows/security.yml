# Проверки безопасности (docs/adr/0020-security-audit.md): уязвимости зависимостей и секреты в истории git.
# На каждый push и PR — и раз в неделю по расписанию: новые уязвимости появляются без наших коммитов.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1' # понедельник, 07:00 по Москве
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Зависимости (composer audit, npm audit — high/critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # Тот же скрипт, что make audit-deps локально: low, medium и заброшенные пакеты — только в выводе
      - name: Уязвимости high и critical
        run: ./scripts/deps-audit.sh

  secrets:
    name: Секреты в истории git (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # вся история: секрет, удалённый поздним коммитом, всё равно лежит в git

      # Официальный образ gitleaks, версия зафиксирована (Dependabot её не обновляет — поднимать вручную).
      # --redact: найденные значения в лог не попадают
      - name: gitleaks — вся история
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose
