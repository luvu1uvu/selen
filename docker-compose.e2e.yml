# Изолированный стек для E2E-тестов (Playwright): make e2e.
# Отдельный compose-проект у каждой рабочей копии — selen-e2e-<папка копии> (scripts/parallel.sh project e2e; LATER-92,
# docs/runbook.md, «Параллельные сессии»): два прогона из разных копий не мешают друг другу. Своя база (в памяти, tmpfs),
# свои Redis и nginx; dev-окружение и его данные не затрагиваются. Фронтенд — production-сборка (frontend/dist).
name: selen-e2e

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: selen_e2e
      # Роли — как в dev (docs/adr/0016-db-roles.md): приложение под selen_app, миграции под selen_owner
      POSTGRES_USER: selen
      POSTGRES_PASSWORD: secret
      SELEN_DB_OWNER: selen_owner
      SELEN_DB_OWNER_PASSWORD: secret
      SELEN_DB_APP: selen_app
      SELEN_DB_APP_PASSWORD: secret
      TZ: UTC
      PGTZ: UTC
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/sql:/selen-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selen -d selen_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  php:
    build:
      context: ./docker/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: selen-php:dev
    env_file: ./docker/e2e/e2e.env
    volumes:
      - ./backend:/var/www/backend
      # Пустой .env поверх dev-файла: всё окружение берётся только из docker/e2e/e2e.env
      - ./docker/e2e/empty.env:/var/www/backend/.env:ro
      # Вложения E2E — отдельно от dev-файлов (ATTACHMENTS_ROOT в e2e.env); каталог создаёт и чистит scripts/e2e.sh
      - ./e2e/.attachments:/var/www/attachments
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    ports:
      # Для ручной проверки production-сборки, пока стек запущен: адрес печатает scripts/e2e.sh. Порт — свободный
      # случайный (у каждой копии свой стек); постоянный — E2E_PORT=8090 make e2e
      - "127.0.0.1:${E2E_PORT:-}:80"
    volumes:
      - ./docker/e2e/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./e2e/.attachments:/var/www/attachments:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Сборка фронтенда (npm ci / npm run build) — вызывается из make e2e
  builder:
    image: node:24-alpine
    profiles: [tools]
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - ./frontend:/app

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [tools]
    working_dir: /e2e
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      BASE_URL: http://nginx
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      CI: ${CI:-}
    ipc: host
    volumes:
      - ./e2e:/e2e
    depends_on:
      nginx:
        condition: service_healthy
