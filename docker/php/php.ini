; Настройки PHP для dev-окружения
date.timezone = UTC
memory_limit = 512M
; Вложения карточек — до 100 МБ (ADR-0010; nginx: client_max_body_size 101m на загрузке)
upload_max_filesize = 100M
post_max_size = 101M
expose_php = Off

; pcov включается только при запуске тестов с покрытием (см. Makefile)
pcov.enabled = 0

; OPcache: в dev проверяем изменения файлов на каждом запросе
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
