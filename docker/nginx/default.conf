# Dev-конфигурация nginx: единая точка входа.
#   /api, /sanctum, /up  → Laravel (php-fpm)
#   /files/{id}          → Laravel: ссылка на файл вложения, которую открывает браузер (UI-1b)
#   всё остальное        → Vite dev server (SPA с hot reload)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # DNS Docker: имена сервисов перерезолвятся, если контейнер пересоздан с новым IP
    # (иначе nginx отдаёт 502 после `docker compose up -d --force-recreate php`)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream php:9000;
    set $vite_upstream http://node:5173;

    # Загрузка вложений — до 100 МБ (ADR-0010; согласовано с php.ini и валидацией). Остальной API — 20 МБ.
    # Regex-location проверяются по порядку: этот должен идти раньше общего /api.
    location ~ ^/api/v1/cards/[^/]+/attachments$ {
        client_max_body_size 101m;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        # Перед этим nginx прокси нет: X-Forwarded-For клиента до Laravel не доходит, вместо него — адрес
        # соединения (подмена IP обходила лимиты входа, LATER-61, ADR-0021)
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 300s;
    }

    # /files/{id} — ссылка на файл вложения, которую открывает сам браузер (UI-1b, LATER-51): веб-маршрут Laravel
    location ~ ^/(api|sanctum|up|files)(/|$) {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 60s;
    }

    # Файлы вложений: Laravel проверяет доступ к карточке и отвечает X-Accel-Redirect, файл отдаёт nginx
    # (Range-запросы и перемотка видео). Снаружи location недоступен. Content-Type и Content-Disposition
    # nginx берёт из ответа Laravel; защитные заголовки — здесь (заголовки ответа Laravel сюда не доходят).
    # Cache-Control nginx передаёт из ответа Laravel (здесь не задаём — иначе заголовок двоится): no-cache — браузер
    # переспрашивает при каждом открытии, Laravel проверяет права, неизменённый файл nginx отдаёт ответом 304 (UI-1b).
    location /_protected/attachments/ {
        internal;
        alias /var/www/attachments/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Тот же каталог — для PDF, открытого в браузере по ссылке /files/{id} (тип — по содержимому, решение PM 21.10):
    # без sandbox (с ним Chrome PDF не показывает), встроенный просмотрщик — object-src 'self'
    # (AttachmentFiles::PDF_CSP); nosniff — как у остальных файлов
    location /_protected/attachments-pdf/ {
        internal;
        alias /var/www/attachments/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; object-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location / {
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
