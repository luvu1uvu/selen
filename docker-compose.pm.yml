# Стенд PM — постоянная копия Selen (docs/runbook.md, «Стенд PM»; ADR-0014).
# Работает из рабочей копии ~/dev/selen-pm (git worktree на коде main); управляется командами
# make pm-* из основной копии. Отдельный compose-проект selen-pm: свои тома PostgreSQL и Redis, свой каталог
# вложений (backend/storage рабочей копии стенда). Фронтенд — production-сборка, nginx — production-конфиг.
# Переменные — из .env рабочей копии стенда (шаблон — .env.pm.example).
name: selen-pm

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  # Свой тег: dev-стек собирает selen-php:dev из ветки этапа, стенд — из main
  image: selen-php:pm
  env_file: .env
  volumes:
    - ./backend:/var/www/backend
    - ./.env:/var/www/backend/.env:ro
    # Отложенные задачи для make pm-backlog (docs/pm/deferred.yaml)
    - ./docs/pm:/var/www/docs/pm:ro
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      # Только с этой машины: на стенде рабочие данные PM
      - "127.0.0.1:${PM_PORT:-8081}:80"
    volumes:
      # Тот же конфиг, что будет на сервере: стенд — его репетиция
      - ./docker/nginx/prod.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend/storage/app/private/attachments:/var/www/backend/storage/app/private/attachments:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  php:
    <<: *php

  # Как на сервере: queue:work держит код в памяти — make pm-update перезапускает контейнер
  queue:
    <<: *php
    command: php artisan queue:work redis --tries=3 --backoff=10 --timeout=60

  scheduler:
    <<: *php
    command: php artisan schedule:work

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-selen}
      # Суперпользователь образа — только для обслуживания; приложение и миграции — под своими ролями
      # (docs/adr/0016-db-roles.md). Существующий том переводит на роли make pm-update (scripts/db-roles.sh)
      POSTGRES_USER: ${DB_SUPERUSER:-selen}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?DB_SUPERUSER_PASSWORD не задан в .env стенда}
      SELEN_DB_OWNER: ${DB_OWNER_USERNAME:-selen_owner}
      SELEN_DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD не задан в .env стенда}
      SELEN_DB_APP: ${DB_USERNAME:-selen_app}
      SELEN_DB_APP_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env стенда}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/sql:/selen-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:${PM_MAIL_PORT:-8026}:8025"
    restart: unless-stopped

  # Сборка фронтенда (npm ci / npm run build) — вызывается из make pm-up / pm-update
  builder:
    image: node:24-alpine
    profiles: [tools]
    working_dir: /app
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      npm_config_cache: /tmp/.npm
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
  redisdata:
